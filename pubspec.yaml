name: jobagz_store
description: JobagzStore — Sari-sari store inventory tracker
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  google_fonts: ^6.1.0
  package_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/jobagz_splash.png
    - assets/images/jobagz_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/jobagz_icon.png
  min_sdk_android: 21
